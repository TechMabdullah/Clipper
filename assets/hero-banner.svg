<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="Clipper Studio — Animated SaaS Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="55%" stop-color="#221E4A"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF">
        <animate attributeName="stop-color" values="#6C63FF;#FF5FA2;#FF8A30;#6C63FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF5FA2">
        <animate attributeName="stop-color" values="#FF5FA2;#FF8A30;#6C63FF;#FF5FA2" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFD43B">
        <animate attributeName="stop-color" values="#FFD43B;#6C63FF;#FF5FA2;#FFD43B" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF">
        <animate attributeName="stop-color" values="#6C63FF;#FF5FA2;#FF8A30;#6C63FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF5FA2">
        <animate attributeName="stop-color" values="#FF5FA2;#FF8A30;#6C63FF;#FF5FA2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFD43B">
        <animate attributeName="stop-color" values="#FFD43B;#6C63FF;#FF5FA2;#FFD43B" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5FA2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8A30" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8A30" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with Animated Glowing Border -->
  <rect width="1120" height="300" rx="28" fill="url(#bgGrad)"/>
  <rect width="1116" height="296" x="2" y="2" rx="27" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.85"/>

  <!-- Ambient drifting radiant orbs -->
  <circle cx="190" cy="70" r="150" fill="url(#glow1)">
    <animate attributeName="cx" values="170;240;170" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="910" cy="220" r="170" fill="url(#glow2)">
    <animate attributeName="cy" values="230;170;230" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="560" cy="50" r="130" fill="url(#glow3)">
    <animate attributeName="cx" values="520;600;520" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating Starfield Particles -->
  <g fill="#FFFFFF">
    <circle cx="280" cy="50" r="1.5">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="80" r="2">
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="65" r="1.5">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="240" r="1.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="260" r="2.2" fill="#FFD43B">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="240" r="2" fill="#FF5FA2">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Live Pulse Badge (Top Right) -->
  <g transform="translate(680, 24)">
    <rect width="180" height="32" rx="16" fill="#141424" stroke="#EF4444" stroke-width="1.2" opacity="0.9"/>
    <!-- Expanding Sonar Ripple -->
    <circle cx="22" cy="16" r="8" fill="none" stroke="#EF4444" stroke-width="1.5">
      <animate attributeName="r" values="5;14" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="16" r="4.5" fill="#EF4444"/>
    <text x="38" y="21" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">LIVE RECORDER : ON</text>
  </g>

  <!-- Animated equalizer visualizer bars on left -->
  <g transform="translate(56, 86)">
    <rect x="0" y="34" width="10" height="60" rx="5" fill="#6C63FF">
      <animate attributeName="height" values="26;88;40;26" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="62;0;48;62" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" y="14" width="10" height="90" rx="5" fill="#FF5FA2">
      <animate attributeName="height" values="88;32;96;88" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="6;62;0;6" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="42" width="10" height="50" rx="5" fill="#FF8A30">
      <animate attributeName="height" values="42;92;28;42" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="46;0;60;46" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="54" y="24" width="10" height="72" rx="5" fill="#FFD43B">
      <animate attributeName="height" values="70;24;84;70" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;66;8;20" dur="1.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Main Heading & Animated Accent Line -->
  <text x="150" y="128" fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">
    Clipper Studio
  </text>
  <rect x="150" y="144" width="380" height="5" rx="2.5" fill="url(#pillGrad)"/>

  <text x="150" y="182" fill="#D5D7F0" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">
    Local-First AI Stream Clipper  •  Next.js 15 + Stripe + Firebase
  </text>

  <!-- Animated Feature Pills -->
  <g transform="translate(150, 210)" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700">
    <rect x="0" y="0" width="136" height="34" rx="17" fill="#6C63FF" fill-opacity="0.22" stroke="#6C63FF"/>
    <text x="68" y="21" text-anchor="middle" fill="#D8D6FF">Live &amp; VOD AI</text>

    <rect x="148" y="0" width="150" height="34" rx="17" fill="#FF8A30" fill-opacity="0.22" stroke="#FF8A30"/>
    <text x="223" y="21" text-anchor="middle" fill="#FFD8B8">Stripe Billing</text>

    <rect x="310" y="0" width="166" height="34" rx="17" fill="#FF5FA2" fill-opacity="0.22" stroke="#FF5FA2"/>
    <text x="393" y="21" text-anchor="middle" fill="#FFD4E7">Doodle Auth + OTP</text>
  </g>

  <!-- Cute Animated Doodle Cast Trio (Right Side) -->
  <g transform="translate(790, 48)">
    <!-- Ground ellipse -->
    <ellipse cx="145" cy="212" rx="115" ry="10" fill="#0B0B17" fill-opacity="0.55"/>

    <!-- Purple Pill Character -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="2.8s" repeatCount="indefinite"/>
      <rect x="44" y="24" width="76" height="176" rx="38" fill="#6C63FF"/>
      <ellipse cx="70" cy="72" rx="9" ry="9" fill="#FFFFFF">
        <animate attributeName="ry" values="9;9;1.5;9;9" keyTimes="0;0.88;0.92;0.96;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="96" cy="72" rx="9" ry="9" fill="#FFFFFF">
        <animate attributeName="ry" values="9;9;1.5;9;9" keyTimes="0;0.88;0.92;0.96;1" dur="4.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="72" cy="72" r="4" fill="#1A1A2E">
        <animate attributeName="cx" values="69;74;69" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="98" cy="72" r="4" fill="#1A1A2E">
        <animate attributeName="cx" values="95;100;95" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M75 96 Q83 105 91 96" stroke="#1A1A2E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Orange Dome Buddy -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="2.4s" repeatCount="indefinite"/>
      <path d="M 10 202 C 10 140, 114 140, 114 202 Z" fill="#FF8A30"/>
      <circle cx="46" cy="172" r="6" fill="#FFFFFF"/>
      <circle cx="76" cy="172" r="6" fill="#FFFFFF"/>
      <circle cx="47" cy="172" r="3" fill="#1A1A2E"/>
      <circle cx="77" cy="172" r="3" fill="#1A1A2E"/>
      <path d="M54 185 Q61 192 68 185" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Yellow Sunny Companion -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="2.2s" repeatCount="indefinite"/>
      <circle cx="195" cy="148" r="38" fill="#FFD43B"/>
      <circle cx="183" cy="142" r="5" fill="#1A1A2E"/>
      <circle cx="207" cy="142" r="5" fill="#1A1A2E"/>
      <path d="M187 156 Q195 164 203 156" stroke="#1A1A2E" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Twinkling Rotating Pink Sparkle -->
    <g transform="translate(168, 56)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#FF5FA2">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>
</svg>
