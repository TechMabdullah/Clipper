<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" width="1120" height="230" role="img" aria-label="Clipper Studio Animated Feature Showcase">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E36"/>
      <stop offset="100%" stop-color="#141424"/>
    </linearGradient>

    <linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#FF5FA2"/>
      <stop offset="100%" stop-color="#FFD43B"/>
    </linearGradient>

    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- CARD 1: BlazeFace Split-Cam & Scanning Box -->
  <g transform="translate(16, 12)">
    <rect width="258" height="206" rx="20" fill="url(#cardGrad)" stroke="#6C63FF" stroke-width="1.5"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800">🎯 AI FaceCam Crop</text>
    <text x="24" y="58" fill="#9CA0BD" font-family="Inter, Segoe UI, sans-serif" font-size="11">BlazeFace 9:16 Auto Split</text>

    <!-- Video Canvas Mockup -->
    <rect x="24" y="74" width="210" height="114" rx="12" fill="#0A0A14" stroke="#2D2D48"/>
    
    <!-- Facecam Area -->
    <rect x="36" y="86" width="68" height="90" rx="8" fill="#18182E" stroke="#6C63FF" stroke-width="1"/>
    <!-- Animated Face Tracking Bounding Box -->
    <g>
      <rect x="44" y="96" width="52" height="52" rx="6" fill="none" stroke="#FF5FA2" stroke-width="2" stroke-dasharray="4 2">
        <animate attributeName="y" values="96;92;98;96" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="x" values="44;46;42;44" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Scanning line moving up and down -->
      <line x1="44" y1="120" x2="96" y2="120" stroke="#FFD43B" stroke-width="2" opacity="0.9">
        <animate attributeName="y1" values="98;144;98" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="98;144;98" dur="1.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Gameplay Area -->
    <rect x="114" y="86" width="108" height="90" rx="8" fill="#121222" stroke="#2A2A44"/>
    <text x="168" y="136" text-anchor="middle" fill="#6C63FF" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700">GAMEPLAY</text>
  </g>

  <!-- CARD 2: Dynamic Virality Gauge & Particle Sparkles -->
  <g transform="translate(290, 12)">
    <rect width="258" height="206" rx="20" fill="url(#cardGrad)" stroke="#FF8A30" stroke-width="1.5"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800">🔥 Virality Predictor</text>
    <text x="24" y="58" fill="#9CA0BD" font-family="Inter, Segoe UI, sans-serif" font-size="11">NLP + Audio Spike Scorer</text>

    <!-- Circular Gauge Background -->
    <circle cx="129" cy="132" r="48" fill="none" stroke="#222238" stroke-width="10"/>
    <!-- Animated Circular Progress Ring (94% fill) -->
    <circle cx="129" cy="132" r="48" fill="none" stroke="url(#scoreGrad)" stroke-width="10"
            stroke-dasharray="301" stroke-dashoffset="301" stroke-linecap="round"
            transform="rotate(-90 129 132)">
      <animate attributeName="stroke-dashoffset" values="301;40;40" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Score Center Counter -->
    <text x="129" y="139" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="900">
      98
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </text>
    <text x="156" y="126" fill="#FF8A30" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800">%</text>
    <text x="129" y="156" text-anchor="middle" fill="#FFD43B" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="800">VIRAL HIT</text>

    <!-- Floating Sparkle Stars -->
    <g transform="translate(186, 92)">
      <polygon points="6,0 8,4 12,6 8,8 6,12 4,8 0,6 4,4" fill="#FFD43B">
        <animateTransform attributeName="transform" type="rotate" values="0 6 6;360 6 6" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </polygon>
    </g>
  </g>

  <!-- CARD 3: 12-Bar Audio Equalizer Spectrum (-14 LUFS) -->
  <g transform="translate(564, 12)">
    <rect width="258" height="206" rx="20" fill="url(#cardGrad)" stroke="#FF5FA2" stroke-width="1.5"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800">🎵 -14 LUFS Audio</text>
    <text x="24" y="58" fill="#9CA0BD" font-family="Inter, Segoe UI, sans-serif" font-size="11">Broadcast Safe &amp; Ducking</text>

    <!-- Equalizer Spectrum Bars Container -->
    <g transform="translate(32, 80)">
      <!-- 10 Responsive Bars -->
      <rect x="0" y="30" width="13" height="65" rx="6.5" fill="#6C63FF">
        <animate attributeName="height" values="25;70;40;80;25" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="70;25;55;15;70" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="20" y="15" width="13" height="80" rx="6.5" fill="#847CFF">
        <animate attributeName="height" values="75;30;85;45;75" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;65;10;50;20" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="40" y="45" width="13" height="50" rx="6.5" fill="#FF5FA2">
        <animate attributeName="height" values="45;85;30;90;45" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="50;10;65;5;50" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="60" y="20" width="13" height="75" rx="6.5" fill="#FF5FA2">
        <animate attributeName="height" values="80;40;90;25;80" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="15;55;5;70;15" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="80" y="35" width="13" height="60" rx="6.5" fill="#FF8A30">
        <animate attributeName="height" values="35;80;50;75;35" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="60;15;45;20;60" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="100" y="10" width="13" height="85" rx="6.5" fill="#FF8A30">
        <animate attributeName="height" values="85;45;70;30;85" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="10;50;25;65;10" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="120" y="40" width="13" height="55" rx="6.5" fill="#FFD43B">
        <animate attributeName="height" values="55;85;35;90;55" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;10;60;5;40" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="140" y="25" width="13" height="70" rx="6.5" fill="#FFD43B">
        <animate attributeName="height" values="65;35;85;40;65" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;60;10;55;30" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="160" y="50" width="13" height="45" rx="6.5" fill="#34D399">
        <animate attributeName="height" values="40;75;25;80;40" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="55;20;70;15;55" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="180" y="30" width="13" height="65" rx="6.5" fill="#34D399">
        <animate attributeName="height" values="70;30;85;40;70" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="25;65;10;55;25" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="129" y="194" text-anchor="middle" fill="#A5A8C8" font-family="Inter, monospace" font-size="11">Peak: -1.0 dBFS • True Peak OK</text>
  </g>

  <!-- CARD 4: Zero-Trust Auth & Stripe Checkout Success -->
  <g transform="translate(838, 12)">
    <rect width="266" height="206" rx="20" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800">🛡️ 2FA &amp; Stripe Verified</text>
    <text x="24" y="58" fill="#9CA0BD" font-family="Inter, Segoe UI, sans-serif" font-size="11">Email OTP • TOTP • Webhooks</text>

    <!-- Animated OTP Input Boxes Mockup -->
    <g transform="translate(24, 76)">
      <rect x="0" y="0" width="32" height="42" rx="8" fill="#1C1C30" stroke="#6C63FF" stroke-width="1.5"/>
      <text x="16" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, monospace" font-size="18" font-weight="800">8</text>

      <rect x="37" y="0" width="32" height="42" rx="8" fill="#1C1C30" stroke="#6C63FF" stroke-width="1.5"/>
      <text x="53" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, monospace" font-size="18" font-weight="800">4</text>

      <rect x="74" y="0" width="32" height="42" rx="8" fill="#1C1C30" stroke="#6C63FF" stroke-width="1.5"/>
      <text x="90" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, monospace" font-size="18" font-weight="800">1</text>

      <rect x="111" y="0" width="32" height="42" rx="8" fill="#1C1C30" stroke="#FF5FA2" stroke-width="1.5"/>
      <text x="127" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, monospace" font-size="18" font-weight="800">9</text>

      <rect x="148" y="0" width="32" height="42" rx="8" fill="#1C1C30" stroke="#FF5FA2" stroke-width="1.5"/>
      <text x="164" y="27" text-anchor="middle" fill="#FFFFFF" font-family="Inter, monospace" font-size="18" font-weight="800">2</text>

      <!-- Blinking 6th cursor slot -->
      <rect x="185" y="0" width="32" height="42" rx="8" fill="#1C1C30" stroke="#34D399" stroke-width="2"/>
      <line x1="201" y1="10" x2="201" y2="32" stroke="#34D399" stroke-width="2.5">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Stripe Success Badge Pill -->
    <g transform="translate(24, 136)">
      <rect width="218" height="48" rx="14" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-width="1.2"/>
      <!-- Animated Pulsing Green Checkmark Ring -->
      <circle cx="28" cy="24" r="14" fill="#34D399" fill-opacity="0.25"/>
      <circle cx="28" cy="24" r="14" fill="none" stroke="#34D399" stroke-width="2">
        <animate attributeName="r" values="14;20;14" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <path d="M22 24 L26 28 L34 20" stroke="#34D399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text x="50" y="22" fill="#FFFFFF" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800">Stripe Subscription Active</text>
      <text x="50" y="38" fill="#34D399" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600">Pro Tier • Webhook Verified</text>
    </g>
  </g>
</svg>
