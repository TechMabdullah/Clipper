packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  nx: true
  sharp: true
  "@tailwindcss/oxide": true
  protobufjs: true
  re2: true
  unrs-resolver: true
  "@firebase/util": true
  "@sentry/cli": true

onlyBuiltDependencies:
  - esbuild
  - nx
  - sharp
  - "@tailwindcss/oxide"
  - protobufjs
  - re2
  - unrs-resolver
  - "@firebase/util"
  - "@sentry/cli"
