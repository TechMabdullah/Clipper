name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Required for Nx affected

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pnpm install --frozen-lockfile --allow-build esbuild --allow-build nx

      - name: Build & Typecheck Monorepo
        env:
          SKIP_ENV_VALIDATION: '1'
        run: pnpm nx run-many -t build typecheck

      - name: Run Automated Test Suite
        run: pnpm test

      - name: Security & HTML Hygiene Check
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');

          const envExample = fs.readFileSync('.env.example', 'utf8').replace(/\r\n/g, '\n');
          if (!/^LLM_API_KEY=""$/m.test(envExample)) {
            throw new Error('.env.example must keep LLM_API_KEY=""');
          }
          for (const match of envExample.matchAll(/^(LLM_API_KEY|GEMINI_API_KEY|OPENAI_API_KEY|GROQ_API_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|FIREBASE_PRIVATE_KEY|FIREBASE_SERVICE_ACCOUNT_JSON|OTP_HMAC_SECRET|ADMIN_TOTP_ENCRYPTION_KEY|INTERNAL_BRIDGE_SECRET|RESEND_API_KEY|UPSTASH_REDIS_REST_TOKEN)=(.*)$/gm)) {
            const val = match[2].split('#')[0].trim();
            if (val !== '""' && val !== '') {
              throw new Error(`Secret key ${match[1]} must be empty in .env.example`);
            }
          }

          const pubDir = path.join('apps', 'clipper-service', 'src', 'public');
          for (const file of fs.readdirSync(pubDir).filter((f) => f.endsWith('.html'))) {
            const html = fs.readFileSync(path.join(pubDir, file), 'utf8');
            const inlineHandlers = html.match(/\son[a-z]+\s*=/gi);
            if (inlineHandlers) {
              throw new Error(`${file} contains inline event handlers: ${inlineHandlers.join(', ')}`);
            }
          }
          console.log('Security & HTML hygiene check passed.');
          EOF

      - name: Verify Python Scripts Syntax
        run: python -m py_compile clipper_tui.py apps/clipper-service/src/live/detect_face.py

      - name: Verify Shell Script Syntax
        run: bash -n update.sh
